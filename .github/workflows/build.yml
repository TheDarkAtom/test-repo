name: Build

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build
        required: true
        default: main
        type: string

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        arch: [i686, x86_64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache deps
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            deps/install
            toolchain
          key: deps-${{ matrix.arch }}-${{ hashFiles('download-toolchain.ps1', 'download-deps.ps1', 'build-deps.ps1', '${{ matrix.arch }}-toolchain.cmake') }}

      - name: Download and extract toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./download-toolchain.ps1 -Arch ${{ matrix.arch }}
      
      - name: Download and extract dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./download-deps.ps1

      - name: Build dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./build-deps.ps1 -Toolchain "${{ github.workspace }}/${{ matrix.arch }}-toolchain.cmake"

      - name: Clone and build
        run: ./build-titan.ps1 -Branch ${{ inputs.branch }} -Toolchain "${{ github.workspace }}/${{ matrix.arch }}-toolchain.cmake"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TitanEditor-${{ inputs.branch }}
          path: build/TitanEditor.exe